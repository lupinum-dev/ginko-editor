packages:
  - .
  - docs

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # Remove when Content 1.0.0-beta.10 is published. See internals/migrations.md.
  '@lupinum/ginko-content': file:internals/candidates/lupinum-ginko-content-1.0.0-beta.10.tgz
  # Remove when fontless requires esbuild 0.28.1 or newer.
  'fontless>esbuild': 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  'vite>esbuild': 0.28.2

  # Compatible security floors for the development and Docs graphs.
  'fast-uri': 3.1.8
  'ip-address': 10.7.1
  'brace-expansion@2': 2.1.7
  'brace-expansion@4': 5.0.12
  'brace-expansion@5': 5.0.12
  'serialize-javascript@7': 7.1.2
  'devalue@5': 5.9.4
  '@simple-git/argv-parser@<2.0.1': 2.0.1
  'source-map-js@<1.2.2': 1.2.2
  'proxy-addr@<2.0.8': 2.0.8
  'sharp@<0.35.5': 0.35.5
  'shell-quote@<1.11.0': 1.11.0
  '@modelcontextprotocol/sdk@<1.31.0': 1.31.0
